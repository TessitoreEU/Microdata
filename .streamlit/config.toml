# Config for hosting behind a reverse proxy that serves the app under a
# sub-path (e.g. SSP Cloud / Onyxia: https://<host>/proxy/<port>/).
# Without baseUrlPath, Streamlit's file-uploader XHR requests and websocket
# connection are built against "/" and fail once the proxy strips/rewrites
# the "/proxy/<port>" prefix. enableXsrfProtection is disabled because the
# proxy can rewrite the Origin/Host headers Streamlit's XSRF check relies on.
[server]
address = "0.0.0.0"
port = 8501
baseUrlPath = "proxy/8501"
enableCORS = false
enableXsrfProtection = false
